[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "normalized-repetition-penalty"
version = "0.1.0"
description = "Shift-invariant (gauge-invariant) repetition penalty logits processors for HuggingFace Transformers"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "Peter Hollows" }]
keywords = ["transformers", "logits-processor", "repetition-penalty", "text-generation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/captainpete/normalized-repetition-penalty"
Paper = "https://arxiv.org/abs/2607.09791"
"Upstream discussion" = "https://github.com/huggingface/transformers/pull/48642"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
